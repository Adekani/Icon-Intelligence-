<!DOCTYPE html>
<html lang="en" class="dark h-full bg-[#050607]">
<head>

  <!-- Google Fonts: DM Sans & Cinzel -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            gold: {
              DEFAULT: '#E5C158',
              light: '#FFF0B3',
              dark: '#B8860B',
              glow: 'rgba(229, 193, 88, 0.4)',
              dim: 'rgba(229, 193, 88, 0.15)',
            },
            bg: {
              deep: '#050607',
              base: '#0B0D10',
              card: '#12151B',
            }
          },
          fontFamily: {
            sans: ['"DM Sans"', 'sans-serif'],

  <style>
    :root {
      --gold: #E5C158;
      --gold-light: #FFF0B3;
      --gold-dark: #B8860B;
      --metallic-gold: linear-gradient(135deg, #E5C158 0%, #FFF0B3 30%, #D4AF37 70%, #996515 100%);
      --bg-deep: #050607;
      --bg-card: #12151B;
      --border-gold: rgba(229, 193, 88, 0.35);
      --border-subtle: rgba(255, 255, 255, 0.12);
    }

    body {
      background-color: var(--bg-deep);
      color: #FFFFFF;
      font-family: 'DM Sans', sans-serif;
      overflow-x: hidden;
      -webkit-tap-highlight-color: transparent;
    }

    /* High-contrast metallic text gradient */
    .text-gold-metallic {
      background: var(--metallic-gold);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    /* Ambient background blur elements */
    .ambient-orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(120px);
      pointer-events: none;
      z-index: 0;
    }

    /* Glass card container with heavy contrast for outdoor glare readability */
    .glass-card {
      background: rgba(18, 21, 27, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--border-subtle);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
    }

    .glass-card-gold {
      background: rgba(22, 25, 32, 0.95);
      backdrop-filter: blur(16px);
      border: 1.5px solid var(--border-gold);
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.6), 0 0 20px rgba(229, 193, 88, 0.15);
    }

    /* SVG Gauge progress circle */
    .gauge-circle {
      transition: stroke-dashoffset 0.4s ease-out;
    }

    /* Transition animations for rotating text */
    .status-text-transition {
      transition: opacity 0.3s ease, transform 0.3s ease;
    }

    /* Custom Range Slider */
    input[type=range] {
      -webkit-appearance: none;
      width: 100%;
      background: transparent;
    }
    input[type=range]:focus {
      outline: none;
    }
    input[type=range]::-webkit-slider-runnable-track {
      width: 100%;
      height: 12px;
      cursor: pointer;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 6px;
      border: 1px solid rgba(229, 193, 88, 0.3);
    }
    input[type=range]::-webkit-slider-thumb {
      height: 32px;
      width: 32px;
      border-radius: 50%;
      background: #E5C158;
      cursor: pointer;
      -webkit-appearance: none;
      margin-top: -10px;
      box-shadow: 0 0 16px rgba(229, 193, 88, 0.8);
    }
  </style>
</head>

    function formatNGN(amount) {
      if (amount === undefined || amount === null) return "₦0";
      return new Intl.NumberFormat('en-NG', {
        style: 'currency',
        currency: 'NGN',
        maximumFractionDigits: 0
      }).format(amount);
    }

    function validateNigerianPhone(phone) {
      const clean = phone.replace(/[^0-9+]/g, '');
      return /^(?:(?:\+?234)|0)[789][01]\d{8}$/.test(clean);
    }

    function showModal(title, bodyText, buttonText, onConfirm) {
      document.getElementById("modal-title").innerText = title;
      document.getElementById("modal-body").innerText = bodyText;
      const btn = document.getElementById("modal-action-btn");
      btn.innerText = buttonText;
      btn.onclick = () => {
        hideModal();
        if (onConfirm) onConfirm();
      };
      document.getElementById("modal-container").classList.remove("hidden");
    }

    function hideModal() {
      document.getElementById("modal-container").classList.add("hidden");
    }

    function updateHeaderStep() {
      const stepIndicator = document.getElementById("step-indicator");
      const quizProgressContainer = document.getElementById("quiz-progress-container");
      const resultsProgressContainer = document.getElementById("results-progress-container");

      if (state.stage === "questions") {
        stepIndicator.classList.remove("hidden");
        quizProgressContainer.classList.remove("hidden");
        resultsProgressContainer.classList.add("hidden");

        const total = state.questions.length || 1;
        const current = state.currentQuestionIndex + 1;
        const pct = Math.round((current / total) * 100);

        document.getElementById("current-step-num").innerText = current;
        document.getElementById("total-steps-num").innerText = total;
        document.getElementById("quiz-progress-text").innerText = `${pct}%`;
        document.getElementById("quiz-progress-bar").style.width = `${pct}%`;
      } else if (state.stage === "results" && state.result) {
        stepIndicator.classList.add("hidden");
        quizProgressContainer.classList.add("hidden");
        resultsProgressContainer.classList.remove("hidden");

        const totalScreens = state.totalResultsScreens || 7;
        const currentIdx = (state.result_reveal_index || 0) + 1;
        
        document.getElementById("results-progress-text").innerText = `${currentIdx} of ${totalScreens}`;
        
        const segContainer = document.getElementById("results-progress-segments");
        if (segContainer) {
          let segsHtml = "";
          for (let i = 0; i < totalScreens; i++) {
            const isActive = i <= state.result_reveal_index;
            const isCurrent = i === state.result_reveal_index;
            segsHtml += `
              <div class="flex-1 h-2 rounded-full transition-all duration-300 ${
                isCurrent 
                  ? 'bg-gold shadow-[0_0_12px_rgba(229,193,88,1)] scale-y-125' 
                  : isActive 
                    ? 'bg-gold/60' 
                    : 'bg-gray-800'
              }"></div>
            `;
          }
          segContainer.innerHTML = segsHtml;
        }
      } else {
        stepIndicator.classList.add("hidden");
        quizProgressContainer.classList.add("hidden");
        resultsProgressContainer.classList.add("hidden");
      }
    }

    /* =====================================================================
       4. API CALLS & FALLBACKS
       ===================================================================== */
    async function apiGenerateQuiz(industry) {
      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 18000);

      try {
        const response = await fetch(ENDPOINTS.GENERATE, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": `Bearer ${SUPABASE_ANON_KEY}`
          },
          body: JSON.stringify({ industry, sub_industry: "" }),
          signal: controller.signal
        });

        clearTimeout(timeoutId);

        if (!response.ok) throw new Error(`Status ${response.status}`);
        return await response.json();
      } catch (err) {
        clearTimeout(timeoutId);
        return getFallbackQuestions(industry);
      }
    }

    async function apiAnalyzeBusiness(sessionId, answers, lead) {

            "Content-Type": "application/json",
            "Authorization": `Bearer ${SUPABASE_ANON_KEY}`
          },
          body: JSON.stringify({ session_id: sessionId, answers, lead }),
          signal: controller.signal
        });

        clearTimeout(timeoutId);

        if (!response.ok) throw new Error(`Status ${response.status}`);
        return await response.json();
      } catch (err) {
        clearTimeout(timeoutId);
        return getFallbackAnalysis(state.industry, answers);
      }
    }

    /* =====================================================================
       5. DYNAMIC ROTATING LOADER ENGINE
       ===================================================================== */
    function renderRotatingLoader(messagesList, onLoaded) {
      const container = document.getElementById("app-container");
      
      container.innerHTML = `
        <div class="text-center space-y-8 py-8 px-2">
          <!-- Circular Animated Percentage Gauge -->
          <div class="relative w-36 h-36 mx-auto flex items-center justify-center">
            <svg class="w-full h-full transform -rotate-90" viewBox="0 0 100 100">
              <circle cx="50" cy="50" r="42" stroke="rgba(255,255,255,0.08)" stroke-width="8" fill="transparent"/>
              <circle id="loading-circle-bar" cx="50" cy="50" r="42" stroke="url(#loadingGoldGrad)" stroke-width="8" fill="transparent"
                stroke-dasharray="263.8" stroke-dashoffset="263.8" stroke-linecap="round" class="gauge-circle"/>
              <defs>
                <linearGradient id="loadingGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" stop-color="#B8860B" />
                  <stop offset="50%" stop-color="#E5C158" />
                  <stop offset="100%" stop-color="#FFF0B3" />
                </linearGradient>
              </defs>
            </svg>
            <div class="absolute inset-0 flex flex-col items-center justify-center">
              <span id="loading-percent-text" class="text-3xl font-bold font-cinzel text-gold-metallic">0%</span>
            </div>
          </div>

          <!-- Rotating Reassuring Micro-Copy -->
          <div class="space-y-3 max-w-xs mx-auto min-h-[70px] flex flex-col justify-center">
            <p id="loading-status-text" class="text-sm font-semibold text-gray-200 leading-snug status-text-transition">
              ${messagesList[0]}
            </p>
            <div class="w-full bg-gray-800 h-1.5 rounded-full overflow-hidden p-0.5">
              <div id="loading-progress-bar" class="bg-gold h-full rounded-full transition-all duration-300" style="width: 0%"></div>
            </div>
          </div>
        </div>
      `;

      let currentPct = 5;
      let msgIndex = 0;

      const statusEl = document.getElementById("loading-status-text");
      const percentEl = document.getElementById("loading-percent-text");
      const barEl = document.getElementById("loading-progress-bar");
      const circleEl = document.getElementById("loading-circle-bar");

      function updateUI(pct) {
        if (percentEl) percentEl.innerText = `${Math.round(pct)}%`;
        if (barEl) barEl.style.width = `${pct}%`;
        if (circleEl) {
          const circumference = 263.8;
          const offset = circumference - (pct / 100) * circumference;
          circleEl.style.strokeDashoffset = offset;
        }
      }

      // Rotate status message every 2.8s
      const msgTimer = setInterval(() => {
        msgIndex = (msgIndex + 1) % messagesList.length;
        if (statusEl) {
          statusEl.style.opacity = '0';
          statusEl.style.transform = 'translateY(6px)';
          setTimeout(() => {
            statusEl.innerText = messagesList[msgIndex];
            statusEl.style.opacity = '1';
            statusEl.style.transform = 'translateY(0)';
          }, 250);
        }
      }, 2800);

      // Smooth progress crawl up to 92% over 25 seconds
      const progressTimer = setInterval(() => {
        if (currentPct < 92) {
          const inc = Math.max(0.4, (94 - currentPct) / 16);
          currentPct += inc;
          updateUI(currentPct);
        }
      }, 250);

      activeLoadingController = {
        finish: (callback) => {
          clearInterval(msgTimer);
          clearInterval(progressTimer);
          
          // Swiftly snap to 100% in a rapid sequence
          let finishTimer = setInterval(() => {
            currentPct += 15;
            if (currentPct >= 100) {
              currentPct = 100;
              updateUI(100);
              clearInterval(finishTimer);
              setTimeout(() => {
                if (callback) callback();
              }, 120);
            } else {
              updateUI(currentPct);
            }
          }, 20);
        }
      };
    }

            </div>

            <div class="space-y-4 pt-2">
              <a href="${state.whatsapp_link || 'https://wa.me/2347085060716'}" target="_blank" rel="noopener"
                class="block w-full py-4 px-6 bg-gradient-to-r from-gold-dark via-gold to-gold-light text-black font-bold rounded-2xl text-xs uppercase tracking-wider shadow-xl active:scale-95 transition-transform text-center">
                Review Results on WhatsApp →
              </a>
              <p class="text-[11px] text-gray-400 font-medium">
                Your score of <strong class="text-gold">${res.audit_score}/100</strong> is saved for your consultation.
              </p>
            </div>
          </div>
        `
      });

      const idx = Math.min(Math.max(0, state.result_reveal_index), revealScreens.length - 1);
      state.totalResultsScreens = revealScreens.length;
      saveState();

      const isFirst = idx === 0;
      const isLast = idx === revealScreens.length - 1;
      const activeScreen = revealScreens[idx];

      container.innerHTML = `
        <div class="space-y-6">
          ${activeScreen.render()}

          <div class="flex items-center justify-between pt-2">
            ${
              !isFirst ? `
                <button id="prev-reveal-btn" class="px-5 py-3 rounded-2xl border border-gray-700 text-gray-300 font-bold text-xs uppercase tracking-wider hover:border-gold/40 transition-all">
                  ← Back
                </button>
              ` : `<div></div>`
            }

            <span class="text-xs font-bold text-gold">
              ${idx + 1} / ${revealScreens.length}
            </span>

            ${
              !isLast ? `
                <button id="next-reveal-btn" class="px-6 py-3 rounded-2xl bg-gold/15 border border-gold/40 text-gold-light font-bold text-xs uppercase tracking-wider hover:bg-gold/25 transition-all">
                  Next →
                </button>
              ` : `<div></div>`
            }
          </div>
        </div>
      `;

      if (activeScreen.type === "score") {
        setTimeout(() => {
          const circle = document.getElementById("score-circle");
          if (circle) {
            const score = res.audit_score || 50;
            const offset = 251.2 - (score / 100) * 251.2;
            circle.style.strokeDashoffset = offset;
          }
        }, 80);
      }

      const prevBtn = document.getElementById("prev-reveal-btn");
      if (prevBtn) {
        prevBtn.onclick = () => {
          state.result_reveal_index--;
          saveState();
          renderCurrentStage();
        };
      }

      const nextBtn = document.getElementById("next-reveal-btn");
      if (nextBtn) {
        nextBtn.onclick = () => {
          state.result_reveal_index++;
          saveState();
          renderCurrentStage();
        };
      }
    }

    // --- MAIN ROUTER ---
    function renderCurrentStage() {
      updateHeaderStep();

      switch (state.stage) {
        case "resume_check":
          renderResumeCheck();
          break;
        case "industry":
          renderIndustrySelect();
          break;
        case "questions":
          renderQuestionScreen();
          break;
        case "contact":
          renderContactScreen();
          break;
        case "results":
          renderResultsReveal();
          break;
        default:
          renderIndustrySelect();
      }
    }

    /* =====================================================================
       7. BOOTSTRAP
       ===================================================================== */
    window.onload = function () {
      const hasSaved = loadState();
      if (hasSaved && state.session_id) {
        state.stage = "resume_check";
      } else {
        state.stage = "industry";
      }
      renderCurrentStage();
    };
  </script>
</body>
</html>
